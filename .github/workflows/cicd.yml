name: SDG CI/CD

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - '*'
      - '!master'
  pull_request:
    types: [closed]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        id: docker_build
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false

  deploy:
    name: "[DEV] - Deploy"
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true) ||
      github.event_name == 'workflow_dispatch'

    env:
      SERVICE_NAME: "sdg-control"
      IMAGE_NAME: "ghcr.io/7-devs-group/sdg-control"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set Git Config
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Generate GitOps repository token
        id: gitops-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ARGOCD_DEPLOY_APP_ID }}
          private-key: ${{ secrets.ARGOCD_DEPLOY_APP_PRIVATE_KEY }}
          owner: 7-devs-group
          repositories: argocd

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate random tag
        id: random_tag
        run: echo "TAG=${GITHUB_SHA::4}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker image
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.random_tag.outputs.TAG }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Argocd - Update Deployment Configuration
        run: |
          git clone https://x-access-token:${{ steps.gitops-token.outputs.token }}@github.com/7-devs-group/argocd.git
          cd argocd
          deployment="apps/platform-system/${{ env.SERVICE_NAME }}/deployment.yaml"
          sed -i "s|image:.*$|image: ${{ env.IMAGE_NAME }}:${{ steps.random_tag.outputs.TAG }}|" "$deployment"
          sed -i "s|replicas: 0|replicas: 1|" "$deployment"
          git add "$deployment"
          git diff --cached --quiet || git commit -m "[${{ env.SERVICE_NAME }}] - Update Docker image tag: ${{ steps.random_tag.outputs.TAG }}"
          git push origin HEAD:master
          echo "Check Deploy in http://argocd.setedevs.com.br"
